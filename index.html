<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday | AI Career Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #212121;
            --chat-bg: #2f2f2f;
            --user-msg-bg: #2f2f2f;
            --bot-msg-bg: #212121;
            --input-bg: #40414f;
            --text-color: #ececf1;
            --accent-color: #10a37f;
            --border-color: #4d4d4f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- HEADER --- */
        header {
            background-color: #171717;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }

        .upload-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .upload-btn:hover { background-color: #1a7f64; }
        
        /* Hidden file input */
        #resume-input { display: none; }

        /* --- CHAT AREA --- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }

        .message.bot { background-color: transparent; }
        .message.user { background-color: var(--user-msg-bg); }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .user .avatar { background-color: #5436DA; color: white; }
        .bot .avatar { background-color: #10a37f; color: white; }

        .content {
            line-height: 1.6;
            font-size: 1rem;
            overflow-x: auto;
        }
        
        /* Markdown Styles */
        .content h1, .content h2, .content h3 { margin-top: 0; }
        .content ul { padding-left: 20px; }
        .content a { color: #8ab4f8; }
        .content code {
            background-color: #3e3e3e;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
        }

        /* --- INPUT AREA --- */
        .input-area {
            background-color: #171717; /* Darker bottom bar */
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            display: flex;
            gap: 10px;
        }

        textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid transparent;
            color: white;
            padding: 12px 15px;
            border-radius: 6px;
            resize: none;
            height: 50px;
            font-family: inherit;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        textarea:focus { border-color: var(--accent-color); }

        button#send-btn {
            background-color: transparent;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            padding: 0 10px;
        }
        button#send-btn:disabled { color: gray; cursor: not-allowed; }

        /* Loading Spinner */
        .typing-indicator {
            display: none;
            color: #888;
            font-size: 0.9rem;
            margin-left: 50px;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>FRIDAY</h1>
        <button class="upload-btn" onclick="document.getElementById('resume-input').click()">
            📄 Upload Resume
        </button>
        <input type="file" id="resume-input" accept=".pdf" onchange="handleFileUpload(this)">
    </header>

    <div id="chat-container">
        <div class="message bot">
            <div class="avatar">F</div>
            <div class="content">Hello! I'm Friday. Upload your resume to get started, or ask me anything about your career.</div>
        </div>
    </div>

    <div class="typing-indicator" id="typing-indicator">Friday is thinking...</div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="Ask about jobs, skills, or interview tips..." onkeydown="handleEnter(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let userId = null; // Persist session

        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const typingIndicator = document.getElementById("typing-indicator");

        function appendMessage(role, text) {
            const div = document.createElement("div");
            div.className = `message ${role}`;
            
            // Avatar
            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.innerText = role === "user" ? "U" : "F";
            
            // Content
            const content = document.createElement("div");
            content.className = "content";
            
            if (role === "bot") {
                // Parse Markdown for bot
                content.innerHTML = marked.parse(text);
            } else {
                content.innerText = text;
            }

            div.appendChild(avatar);
            div.appendChild(content);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Show User Message
            appendMessage("user", text);
            userInput.value = "";
            typingIndicator.style.display = "block";

            try {
                // 2. Send to Backend
                const response = await fetch(`${API_URL}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: text, user_id: userId })
                });

                const data = await response.json();
                
                // 3. Update User ID if new
                if (data.user_id) {
                    userId = data.user_id;
                    localStorage.setItem("friday_user_id", userId);
                }

                // 4. Show Bot Response
                typingIndicator.style.display = "none";
                appendMessage("bot", data.response);

            } catch (error) {
                typingIndicator.style.display = "none";
                appendMessage("bot", "⚠️ Error connecting to Friday backend. Is it running?");
                console.error(error);
            }
        }

        async function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            appendMessage("user", `Uploading resume: ${file.name}...`);
            typingIndicator.style.display = "block";

            const formData = new FormData();
            formData.append("file", file);
            if (userId) formData.append("user_id", userId);

            try {
                const response = await fetch(`${API_URL}/upload-resume`, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (data.user_id) {
                    userId = data.user_id;
                    localStorage.setItem("friday_user_id", userId);
                }

                typingIndicator.style.display = "none";
                appendMessage("bot", `✅ **Resume Analyzed!**\n\n${data.analysis_summary || "I'm ready to help you with job searches."}`);

            } catch (error) {
                typingIndicator.style.display = "none";
                appendMessage("bot", "⚠️ Upload failed.");
                console.error(error);
            }
        }

        function handleEnter(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
